<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PICNIKO — Choose your space</title>
<link rel="stylesheet" href="category.css">
<link rel="stylesheet" href="../css/mobile-app.css">
<link href="../css/mobile-universal.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/v44-mobile-fit.css">
<link rel="stylesheet" href="../css/v45-mobile-stable.css">
</head>
<body>
<main class="screen">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back">‹</button>
    <div class="brand-wrap">
      <div class="brand">PICNIKO</div>
      <div class="tagline">Explore · Connect · Earn</div>
    </div>
    <div class="step">2 / 2</div>
  </header>

  <section class="intro">
    <div class="eyebrow">PERSONALIZE YOUR PICNIKO</div>
    <h1>तुम्ही PICNIKO वर काय करता?</h1>
    <p>तुमची मुख्य category निवडा. त्यानुसार Home Menu आणि relevant features दाखवले जातील.</p>
  </section>

  <section class="category-grid" id="categoryGrid" aria-label="Choose category">
    <button class="category" data-key="student"><span class="emoji">🎓</span><span><b>Student</b><small>Study · Events · Groups</small></span></button>
    <button class="category" data-key="teacher"><span class="emoji">👩‍🏫</span><span><b>Teacher</b><small>Education · Community</small></span></button>
    <button class="category" data-key="civic"><span class="emoji">🏛️</span><span><b>Civic Member</b><small>Janseva · Local Updates</small></span></button>
    <button class="category" data-key="real-estate"><span class="emoji">🏠</span><span><b>Real Estate Agent</b><small>Property · Leads</small></span></button>
    <button class="category" data-key="developer"><span class="emoji">💻</span><span><b>Developer</b><small>Tech · Projects · Network</small></span></button>
    <button class="category" data-key="hotel-restaurant"><span class="emoji">🍽️</span><span><b>Hotel / Restaurant</b><small>Offers · Orders · Marketing</small></span></button>
    <button class="category" data-key="picnic-point"><span class="emoji">🏞️</span><span><b>Picnic Point</b><small>Place · Booking · Offers</small></span></button>
    <button class="category" data-key="business"><span class="emoji">💼</span><span><b>Businessman</b><small>Business · Marketplace · Ads</small></span></button>
    <button class="category" data-key="creator"><span class="emoji">🎥</span><span><b>Creator</b><small>Reels · Audience · Rewards</small></span></button>
    <button class="category" data-key="professional"><span class="emoji">🧑‍💼</span><span><b>Professional</b><small>Profile · Connect · Work</small></span></button>
    <button class="category" data-key="traveller"><span class="emoji">🧳</span><span><b>Traveller</b><small>Explore · Trips · Places</small></span></button>
    <button class="category" data-key="other"><span class="emoji">✨</span><span><b>Other</b><small>Personalize my experience</small></span></button>
  </section>

  <footer class="footer">
    <button class="continue" id="continueBtn" disabled>Continue</button>
    <button class="skip" id="skipBtn">Choose later</button>
  </footer>
</main>
<script src="category.js"></script>
</body>
</html>
