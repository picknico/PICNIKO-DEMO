<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PICNIKO — Connect</title><link rel="stylesheet" href="../../css/core.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/config.js"></script><style>.connect-tabs{display:flex;gap:8px;margin:12px 0}.connect-tabs button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px}.connect-tabs .on{background:#6337e8;color:#fff}.person{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #eee}.personmain{flex:1;min-width:0}.status{font-size:12px;color:#707789;margin-top:3px}</style></head><body><div class="app"><div class="shell"><header class="top"><div class="topin"><a class="brand" href="../home/home.html"><span class="logo">P</span>PICNIKO</a><div class="row"><a class="icon" href="../messages/messages.html">✉</a><a class="avatar" href="../profile/profile.html">P</a></div></div></header><main class="page"><section class="hero"><span class="eyebrow">PICNIKO CONNECT</span><h1>लोकांना शोधा. Connect करा.</h1><p>Existing production friend_requests आणि RPCs वापरून Connect backend जोडलेले आहे.</p></section><section class="card"><div style="display:flex;gap:8px"><input id="q" class="discover-search" placeholder="नाव, role किंवा account शोधा..."><button id="go" class="btn outline">Search</button></div><div class="connect-tabs"><button id="peopleTab" class="on">People</button><button id="reqTab">Requests</button></div><div id="status" class="muted">Loading...</div><div id="list"></div></section></main></div></div><script type="module">import {mountBottom} from '../../js/app.js';import {discoverPeople,sendConnect,toast,esc} from '../../js/v32-backend.js';import {getDb} from '../../js/db.js';mountBottom('home');const q=document.getElementById('q'),list=document.getElementById('list'),status=document.getElementById('status');async function people(){status.textContent='People loading...';const x=await discoverPeople(q.value);if(x.error){status.textContent=x.error.message;return}const a=x.data||[];status.textContent=`${a.length} users found`;list.innerHTML=a.map(u=>`<div class="person"><div class="avatar">${esc((u.full_name||'P')[0])}</div><div class="personmain"><b>${esc(u.full_name||'PICNIKO User')}</b><div class="status">${esc(u.role||'USER')}</div></div><button class="btn primary" data-connect="${u.user_id}">＋ Connect</button></div>`).join('')||'<div class="muted">No users found.</div>';list.querySelectorAll('[data-connect]').forEach(b=>b.onclick=async()=>{b.disabled=true;const x=await sendConnect(b.dataset.connect);toast(x.error?x.error.message:(x.data?.status==='accepted'?'Already friends':'Request sent'));b.textContent='Sent';})}async function requests(){const db=getDb();const {data:{user}}=await db.auth.getUser();const x=await db.from('friend_requests').select('id,requester_id,created_at').eq('recipient_id',user.id).eq('status','pending').order('created_at',{ascending:false});if(x.error){status.textContent=x.error.message;return}status.textContent=`${x.data?.length||0} pending requests`;list.innerHTML=(x.data||[]).map(r=>`<div class="person"><div class="avatar">P</div><div class="personmain"><b>Friend request</b><div class="status">Request ID: ${esc(r.id.slice(0,8))}</div></div><button class="btn primary" data-accept="${r.id}">Accept</button><button class="btn outline" data-decline="${r.id}">Decline</button></div>`).join('')||'<div class="muted">No pending requests.</div>';list.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{const y=await db.rpc('respond_friend_request',{p_request_id:b.dataset.accept,p_action:'accept'});toast(y.error?y.error.message:'Friend request accepted');requests()});list.querySelectorAll('[data-decline]').forEach(b=>b.onclick=async()=>{const y=await db.rpc('respond_friend_request',{p_request_id:b.dataset.decline,p_action:'decline'});toast(y.error?y.error.message:'Request declined');requests()})}document.getElementById('peopleTab').onclick=()=>{document.getElementById('peopleTab').classList.add('on');document.getElementById('reqTab').classList.remove('on');people()};document.getElementById('reqTab').onclick=()=>{document.getElementById('reqTab').classList.add('on');document.getElementById('peopleTab').classList.remove('on');requests()};document.getElementById('go').onclick=people;q.onkeydown=e=>{if(e.key==='Enter')people()};people();</script></body></html>
