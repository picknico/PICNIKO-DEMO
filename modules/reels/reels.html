<script type="module">
import {mountBottom} from '../../js/app.js';import {listReels,createReel,toggleReelLike,toggleReelSave,reelComments,addReelComment,toast,esc} from '../../js/v32-backend.js';mountBottom('home');
const root=document.getElementById('reels');
function publicVideoUrl(path){
  return window.supabase.createClient(window.PICNIKO_CONFIG.SUPABASE_URL,window.PICNIKO_CONFIG.SUPABASE_ANON_KEY).storage.from('reel-media').getPublicUrl(path).data.publicUrl;
}
function render(rows){
  root.innerHTML=rows.map((r,i)=>{
    const e=r.engagement||{};
    const liked=!!e.liked, saved=!!e.saved;
    const likes=Number(e.like_count||0), comments=Number(e.comment_count||0), saves=Number(e.save_count||0);
    const url=r.video_path?publicVideoUrl(r.video_path):'';
    return `<article class="reelcard" data-id="${r.id}">
      <div class="reel-media-bg" style="background-image:url('${esc(url)}')"></div>
      <video src="${esc(url)}" autoplay muted loop playsinline preload="auto" controlsList="nodownload" disablePictureInPicture aria-label="PICNIKO Reel video"></video>
      <div class="reel-media-vignette"></div><button class="reel-play" type="button" aria-label="Play or pause">▶</button><div class="reel-progress"><i></i></div>
      <div class="reel-top-tools">
        <button data-a="mute" aria-label="Mute or unmute">🔊</button>
        <button data-a="more" aria-label="More options">⋮</button>
      </div>
      <div class="reelinfo"><b>${esc(r.location_name||'PICNIKO Creator')}</b><h2>${esc(r.caption||'PICNIKO Reel')}</h2><p>${(r.hashtags||[]).map(x=>'#'+esc(String(x).replace(/^#/,''))).join(' ')}</p></div>
      <div class="reel-audio">🎵 Original audio • PICNIKO Reel</div>
      <div class="reelactions">
        <button data-a="like" class="${liked?'active':''}" aria-pressed="${liked}"><span class="action-icon">${liked?'♥':'♡'}</span><small>${likes}</small></button>
        <button data-a="comment"><span>💬</span><small>${comments}</small></button>
        <button data-a="save" class="${saved?'active':''}" aria-pressed="${saved}"><span>🔖</span><small>${saves}</small></button>
        <button data-a="share"><span>↗</span><small>Share</small></button>
        <button data-a="plan"><span>🗺</span><small>Plan</small></button>
      </div>
    </article>`;
  }).join('')||'<div class="card">अजून Reels नाहीत. पहिला Reel तुम्ही तयार करा.</div>';

  root.querySelectorAll('[data-a="like"]').forEach(b=>b.onclick=async()=>{
    const id=b.closest('[data-id]').dataset.id;
    b.disabled=true;
    const x=await toggleReelLike(id);
    b.disabled=false;
    if(x.error){toast(x.error.message);return;}
    const small=b.querySelector('small');
    const current=Number(small.textContent||0);
    const nowLiked=x.liked===true;
    b.classList.toggle('active',nowLiked); b.setAttribute('aria-pressed',String(nowLiked));
    b.querySelector('.action-icon').textContent=nowLiked?'♥':'♡';
    small.textContent=Math.max(0,current+(nowLiked?1:-1));
  });
  root.querySelectorAll('[data-a="save"]').forEach(b=>b.onclick=async()=>{
    const id=b.closest('[data-id]').dataset.id;
    b.disabled=true; const x=await toggleReelSave(id); b.disabled=false;
    if(x.error){toast(x.error.message);return;}
    const small=b.querySelector('small'); const current=Number(small.textContent||0); const nowSaved=x.saved===true;
    b.classList.toggle('active',nowSaved); b.setAttribute('aria-pressed',String(nowSaved)); small.textContent=Math.max(0,current+(nowSaved?1:-1));
  });
  root.querySelectorAll('[data-a="share"]').forEach(b=>b.onclick=async()=>{const id=b.closest('[data-id]').dataset.id;const url=location.href.split('#')[0]+'#reel='+id;try{if(navigator.share) await navigator.share({title:'PICNIKO Reel',text:'Watch this Reel on PICNIKO',url});else if(navigator.clipboard) await navigator.clipboard.writeText(url);toast('Share link ready')}catch(e){if(e?.name!=='AbortError')toast('Share failed')}});

  root.querySelectorAll('[data-a="plan"]').forEach(b=>b.onclick=()=>toast('🗺 Plan Trip from this Reel — destination flow ready for integration'));
  root.querySelectorAll('[data-a="mute"]').forEach(b=>b.onclick=()=>{const v=b.closest('[data-id]').querySelector('video'); if(v.muted){v.muted=false; v.volume=1; b.textContent='🔊'; v.play().catch(()=>{});}else{v.muted=true; b.textContent='🔇';}});
  setupReelPlayback();
  root.querySelectorAll('[data-a="more"]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();const id=b.closest('[data-id]').dataset.id;openReelMore(id,b)});
}
/* V37 REAL playback engine: one Reel at a time, reliable mobile autoplay */
let reelObserver=null;
function setupReelPlayback(){
  if(reelObserver) reelObserver.disconnect();
  const scroller=document.getElementById('reels');
  const cards=[...root.querySelectorAll('.reelcard')];
  const videos=cards.map(c=>c.querySelector('video')).filter(Boolean);
  const pauseOthers=(keep)=>cards.forEach(c=>{const v=c.querySelector('video'); if(v&&c!==keep){v.pause();c.classList.remove('is-visible');c.classList.add('paused')}});
  const playCard=(card)=>{const v=card?.querySelector('video'); if(!v)return; pauseOthers(card); card.classList.add('is-visible'); card.classList.remove('paused'); v.muted=true; const p=v.play(); if(p?.catch)p.catch(()=>{});};
  videos.forEach(v=>{
    v.autoplay=true; v.loop=true; v.muted=true; v.playsInline=true;
    v.setAttribute('autoplay','');v.setAttribute('muted','');v.setAttribute('loop','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
    v.controls=false; v.removeAttribute('controls');
    v.addEventListener('timeupdate',()=>{const bar=v.closest('.reelcard')?.querySelector('.reel-progress i');if(bar&&v.duration)bar.style.width=((v.currentTime/v.duration)*100)+'%'});
    v.addEventListener('ended',()=>{v.currentTime=0;v.play().catch(()=>{})});
  });
  reelObserver=new IntersectionObserver(entries=>{
    let best=null,bestRatio=0;
    entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>bestRatio){best=e.target;bestRatio=e.intersectionRatio}});
    if(best&&bestRatio>=0.55)playCard(best);
  },{root:scroller,threshold:[0.55,0.75,0.9]});
  cards.forEach(c=>reelObserver.observe(c));
  const first=cards[0]; if(first){first.classList.add('paused'); requestAnimationFrame(()=>playCard(first));}
  cards.forEach(card=>{
    const v=card.querySelector('video'), play=card.querySelector('.reel-play');
    const toggle=()=>{if(v.paused){playCard(card)}else{v.pause();card.classList.add('paused')}};
    play?.addEventListener('click',e=>{e.stopPropagation();toggle()});
    v.addEventListener('click',e=>{e.stopPropagation();toggle()});
  });
}

let activeCommentReel=null;
const commentBackdrop=document.getElementById('commentBackdrop'),commentList=document.getElementById('commentList'),commentInput=document.getElementById('commentInput'),commentCount=document.getElementById('commentCount');
function initials(name){return String(name||'P').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'P'}
function ago(v){const d=Math.max(1,Math.floor((Date.now()-new Date(v).getTime())/60000));return d<60?d+'m':d<1440?Math.floor(d/60)+'h':Math.floor(d/1440)+'d'}
function renderComments(rows){commentCount.textContent=`${rows.length} comment${rows.length===1?'':'s'}`;commentList.innerHTML=rows.length?rows.map(c=>`<div class="comment-row"><div class="comment-avatar">${esc(initials(c.profiles?.full_name))}</div><div class="comment-main"><div><span class="comment-name">${esc(c.profiles?.full_name||'PICNIKO User')}</span><span class="comment-time">${ago(c.created_at)}</span></div><div class="comment-body">${esc(c.body||'')}</div><div class="comment-actions"><button type="button">Like</button><button type="button">Reply</button></div></div></div>`).join(''):'<div class="comment-empty"><div style="font-size:38px;margin-bottom:10px">💬</div><b>No comments yet</b><div style="margin-top:6px">Be the first to share your thoughts.</div></div>'}
async function openComments(id){activeCommentReel=id;commentBackdrop.classList.add('open');commentBackdrop.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';commentList.innerHTML='<div class="comment-empty">Loading comments…</div>';commentInput.value='';const x=await reelComments(id);if(x.error){commentList.innerHTML=`<div class="comment-empty">${esc(x.error.message)}</div>`;return}renderComments(x.data||[]);setTimeout(()=>commentInput.focus(),100)}
function closeComments(){commentBackdrop.classList.remove('open');commentBackdrop.setAttribute('aria-hidden','true');document.body.style.overflow=''}
async function sendComment(){const body=commentInput.value.trim();if(!activeCommentReel||!body)return;const btn=document.getElementById('commentSend');btn.disabled=true;const y=await addReelComment(activeCommentReel,body);btn.disabled=false;if(y.error){toast(y.error.message);return}commentInput.value='';const x=await reelComments(activeCommentReel);if(!x.error)renderComments(x.data||[]);toast('Comment added')}
document.getElementById('commentClose').onclick=closeComments;commentBackdrop.addEventListener('click',e=>{if(e.target===commentBackdrop)closeComments()});document.getElementById('commentSend').onclick=sendComment;commentInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendComment()}});document.getElementById('commentEmoji').onclick=()=>{commentInput.value+=' 😊';commentInput.focus()};
