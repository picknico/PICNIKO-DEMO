<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PICNIKO Reels</title>
<link rel="stylesheet" href="../../css/core.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/config.js"></script>
<style>
:root{--pink:#ff2d72;--purple:#8b5cf6;--text:#fff;--muted:#c9c9cf;--glass:rgba(15,15,18,.42)}
*{box-sizing:border-box}html,body{margin:0!important;padding:0!important;width:100%;height:100%;background:#000!important;overflow:hidden!important;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{color:#fff}.app,.shell,.page{width:100%!important;max-width:none!important;min-height:100%!important;margin:0!important;padding:0!important;background:#000!important}
#reels{position:fixed;inset:0;width:100vw;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;background:#000}
.reel{position:relative;width:100vw;height:100dvh;min-height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#050505;isolation:isolate}
.media-bg{position:absolute;inset:-8%;z-index:0;background-position:center;background-size:cover;filter:blur(28px) brightness(.32);transform:scale(1.08)}
.media-wrap{position:absolute;inset:0;z-index:1;display:grid;place-items:center;background:#000}
.media-wrap video{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:transparent;outline:none}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.48) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.02) 50%,rgba(0,0,0,.78) 100%)}
.topbar{position:fixed;left:0;right:0;top:0;height:72px;z-index:100;display:flex;align-items:flex-end;padding:0 14px 10px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.58),transparent)}
.topbar>*{pointer-events:auto}.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:900;font-size:17px;text-shadow:0 2px 10px #000}.brandmark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#d9d0ff);color:#6b42e8;font-weight:1000}
.top-tabs{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:18px;align-items:center;max-width:65vw;overflow:auto;scrollbar-width:none}.top-tabs::-webkit-scrollbar{display:none}.top-tabs button{border:0;background:none;color:rgba(255,255,255,.66);font-size:12px;font-weight:800;white-space:nowrap;padding:7px 0}.top-tabs button.active{color:#fff;position:relative}.top-tabs button.active:after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:20px;height:2px;border-radius:4px;background:#fff}
.create-btn{margin-left:auto;width:38px;height:38px;border:1px solid rgba(255,255,255,.24);border-radius:50%;background:rgba(0,0,0,.25);backdrop-filter:blur(12px);color:#fff;font-size:20px}
.side{position:absolute;right:10px;bottom:calc(105px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;align-items:center;gap:13px}.side-action{width:48px;border:0;background:none;color:#fff;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-shadow:0 2px 8px #000}.side-action .ico{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.24);backdrop-filter:blur(10px);font-size:22px;transition:.18s transform,.18s background}.side-action small{font-size:10px;font-weight:800;color:#fff}.side-action.active .ico{background:rgba(255,45,114,.32);transform:scale(1.04)}.side-action.active .heart{color:#ff477f}.side-action:active .ico{transform:scale(.9)}
.bottom-info{position:absolute;left:14px;right:78px;bottom:calc(28px + env(safe-area-inset-bottom));z-index:25;color:#fff;text-shadow:0 2px 10px #000}.creator{display:flex;align-items:center;gap:9px;margin-bottom:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#9b7bff,#0ac5a1);font-weight:900;border:1.5px solid #fff8}.creator-name{font-size:14px;font-weight:900}.follow{border:1px solid #ffffff77;background:rgba(0,0,0,.18);color:#fff;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800}.caption{font-size:14px;font-weight:650;line-height:1.35;max-width:92%;margin-bottom:6px}.hashtags{font-size:12px;color:#eee;line-height:1.35}.audio{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11px;color:#fff}.disc{width:20px;height:20px;border-radius:50%;background:conic-gradient(#fff,#777,#fff);box-shadow:0 0 0 2px #ffffff33}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);width:66px;height:66px;border-radius:50%;border:1px solid #ffffff55;background:rgba(0,0,0,.34);backdrop-filter:blur(10px);color:#fff;font-size:27px;z-index:24;opacity:0;transition:.18s;pointer-events:none}.reel.paused .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mute{position:absolute;right:14px;top:82px;z-index:30;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff33;background:rgba(0,0,0,.28);color:#fff;backdrop-filter:blur(10px)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.24);z-index:40}.progress i{display:block;width:0;height:100%;background:#fff;border-radius:99px}
.empty,.error{height:100%;display:grid;place-items:center;color:#fff;padding:30px;text-align:center}.empty-card,.error-card{max-width:360px;padding:25px;border:1px solid #ffffff1e;border-radius:24px;background:#1113;backdrop-filter:blur(18px)}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.66);backdrop-filter:blur(8px);display:none;align-items:flex-end}.modal-backdrop.open{display:flex}.sheet{width:min(640px,100%);max-height:84dvh;background:#fff;color:#17171a;border-radius:26px 26px 0 0;overflow:hidden;display:flex;flex-direction:column}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #eee}.sheet-title{font-weight:900}.close{width:36px;height:36px;border:0;border-radius:50%;background:#f2f2f5}.comment-list{flex:1;overflow:auto;padding:8px 18px 15px}.comment{display:flex;gap:10px;padding:12px 0}.comment .ca{width:36px;height:36px;border-radius:50%;background:#eee8ff;color:#6b42e8;display:grid;place-items:center;font-weight:900;flex:none}.comment-body{font-size:13px;line-height:1.45}.comment-name{font-weight:900}.comment-time{font-size:10px;color:#999;margin-left:5px}.comment-compose{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eee;display:flex;gap:8px;background:#fff}.comment-compose textarea{flex:1;min-height:42px;max-height:100px;border:1px solid #ddd;border-radius:16px;padding:11px;resize:none;font:inherit;outline:none}.send{width:45px;height:45px;border:0;border-radius:15px;background:#6b42e8;color:#fff;font-size:18px}
.create-sheet{padding:18px}.create-sheet input,.create-sheet textarea{width:100%;border:1px solid #ddd;border-radius:14px;padding:12px;margin:7px 0;font:inherit}.create-sheet textarea{min-height:90px}.create-actions{display:flex;gap:8px;margin-top:8px}.create-actions button{flex:1;padding:13px;border-radius:14px;border:1px solid #ddd;font-weight:800}.publish{background:linear-gradient(135deg,#6b42e8,#12aebe);color:#fff;border:0!important}
@media(min-width:700px){#reels{background:#151515}.reel{width:min(430px,100vw);margin:0 auto}.topbar{width:min(430px,100vw);left:50%;right:auto;transform:translateX(-50%)}.sheet{border-radius:26px;margin:auto}.modal-backdrop{align-items:center;justify-content:center}.side{right:calc(50% - 205px)}.mute{right:calc(50% - 195px)}}
@media(max-width:420px){.top-tabs{gap:14px;max-width:66vw}.top-tabs button{font-size:11px}.side{right:7px;gap:10px}.side-action .ico{width:43px;height:43px}.bottom-info{right:72px}.caption{font-size:13px}}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../home/home.html"><span class="brandmark">P</span>PICNIKO</a>
  <div class="top-tabs" id="tabs"><button class="active">For You</button><button>Following</button><button>Nearby</button><button>Travel</button><button>Food</button><button>Trending</button></div>
  <button class="create-btn" id="create" aria-label="Create Reel">＋</button>
</div>
<div id="reels"><div class="empty"><div class="empty-card">Reels loading…</div></div></div>

<div class="modal-backdrop" id="commentBackdrop" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><div class="sheet-title" id="commentTitle">Comments</div><button class="close" id="commentClose">✕</button></div>
    <div class="comment-list" id="commentList"></div>
    <div class="comment-compose"><textarea id="commentInput" placeholder="Add a comment…"></textarea><button class="send" id="commentSend">➤</button></div>
  </div>
</div>

<div class="modal-backdrop" id="createBackdrop" aria-hidden="true">
  <div class="sheet create-sheet">
    <div class="sheet-head" style="padding:0 0 12px"><div class="sheet-title">Create Reel</div><button class="close" id="createClose">✕</button></div>
    <input id="video" type="file" accept="video/*">
    <input id="location" placeholder="📍 Location / Place">
    <textarea id="caption" placeholder="Write a caption…"></textarea>
    <input id="hashtags" placeholder="#travel #mulshi">
    <div class="create-actions"><button id="cancel">Cancel</button><button id="publish" class="publish">Publish Reel</button></div>
  </div>
</div>

<script type="module">
import {listReels,createReel,toggleReelLike,toggleReelSave,reelComments,addReelComment,toast,esc} from '../../js/v32-backend.js';
const root=document.getElementById('reels');
const icons={heart:'♡',comment:'💬',save:'🔖',share:'↗',plan:'⌖'};
function initials(name){return String(name||'P').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'P'}
function publicVideoUrl(path){const s=window.supabase.createClient(window.PICNIKO_CONFIG.SUPABASE_URL,window.PICNIKO_CONFIG.SUPABASE_ANON_KEY);return s.storage.from('reel-media').getPublicUrl(path).data.publicUrl}
function ago(v){const m=Math.max(1,Math.floor((Date.now()-new Date(v).getTime())/60000));return m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'}
function render(rows){
 if(!rows.length){root.innerHTML='<div class="empty"><div class="empty-card"><div style="font-size:34px">🎬</div><h3>No Reels yet</h3><p>Create the first PICNIKO Reel.</p></div></div>';return}
 root.innerHTML=rows.map(r=>{const e=r.engagement||{};const url=r.video_path?publicVideoUrl(r.video_path):'';const tags=(r.hashtags||[]).map(x=>'#'+String(x).replace(/^#/,'')).join(' ');return `<article class="reel" data-id="${esc(r.id)}">
  <div class="media-bg" style="background-image:url('${esc(url)}')"></div><div class="media-wrap"><video src="${esc(url)}" muted loop playsinline preload="metadata"></video></div><div class="vignette"></div>
  <button class="play" type="button">▶</button><button class="mute" data-a="mute">🔇</button>
  <div class="side">
   <button class="side-action ${e.liked?'active':''}" data-a="like"><span class="ico heart">${e.liked?'♥':'♡'}</span><small>${Number(e.like_count||0)}</small></button>
   <button class="side-action" data-a="comment"><span class="ico">${icons.comment}</span><small>${Number(e.comment_count||0)}</small></button>
   <button class="side-action ${e.saved?'active':''}" data-a="save"><span class="ico">${icons.save}</span><small>${Number(e.save_count||0)}</small></button>
   <button class="side-action" data-a="share"><span class="ico">${icons.share}</span><small>Share</small></button>
   <button class="side-action" data-a="plan"><span class="ico">${icons.plan}</span><small>Plan</small></button>
  </div>
  <div class="bottom-info"><div class="creator"><span class="avatar">${esc(initials(r.profiles?.full_name||r.location_name||'P'))}</span><span class="creator-name">${esc(r.profiles?.full_name||'PICNIKO Creator')}</span><button class="follow" type="button">Follow</button></div>
   <div class="caption">${esc(r.caption||'PICNIKO Reel')}</div><div class="hashtags">${esc(tags)}</div><div class="audio"><span class="disc"></span><span>Original audio • PICNIKO Reel</span></div>
  </div><div class="progress"><i></i></div>
 </article>`}).join('');
 bind(); setupPlayback();
}
function bind(){
 root.querySelectorAll('[data-a="like"]').forEach(b=>b.onclick=async()=>{const card=b.closest('.reel');const id=card.dataset.id;b.disabled=true;const x=await toggleReelLike(id);b.disabled=false;if(x.error){toast(x.error.message);return}const n=b.querySelector('small'),cur=Number(n.textContent||0),on=x.liked===true;b.classList.toggle('active',on);b.querySelector('.heart').textContent=on?'♥':'♡';n.textContent=Math.max(0,cur+(on?1:-1))});
 root.querySelectorAll('[data-a="save"]').forEach(b=>b.onclick=async()=>{const card=b.closest('.reel');const x=await toggleReelSave(card.dataset.id);if(x.error){toast(x.error.message);return}const n=b.querySelector('small'),cur=Number(n.textContent||0),on=x.saved===true;b.classList.toggle('active',on);n.textContent=Math.max(0,cur+(on?1:-1))});
 root.querySelectorAll('[data-a="comment"]').forEach(b=>b.onclick=()=>openComments(b.closest('.reel').dataset.id));
 root.querySelectorAll('[data-a="share"]').forEach(b=>b.onclick=async()=>{const u=location.href.split('#')[0]+'#reel='+b.closest('.reel').dataset.id;try{if(navigator.share)await navigator.share({title:'PICNIKO Reel',text:'Watch this Reel on PICNIKO',url:u});else await navigator.clipboard.writeText(u);toast('Share link ready')}catch(e){if(e?.name!=='AbortError')toast('Share failed')}});
 root.querySelectorAll('[data-a="plan"]').forEach(b=>b.onclick=()=>toast('Plan Trip flow opened from this Reel'));
 root.querySelectorAll('[data-a="mute"]').forEach(b=>b.onclick=()=>{const v=b.closest('.reel').querySelector('video');v.muted=!v.muted;b.textContent=v.muted?'🔇':'🔊';if(!v.muted)v.play().catch(()=>{})});
 root.querySelectorAll('.play').forEach(b=>b.onclick=()=>toggleVideo(b.closest('.reel')));
 root.querySelectorAll('video').forEach(v=>v.addEventListener('click',e=>{e.stopPropagation();toggleVideo(v.closest('.reel'))}));
}
function toggleVideo(card){const v=card?.querySelector('video');if(!v)return;if(v.paused){playOnly(card)}else{v.pause();card.classList.add('paused')}}
let observer;
function setupPlayback(){if(observer)observer.disconnect();const cards=[...root.querySelectorAll('.reel')];observer=new IntersectionObserver(es=>{let best=null,ratio=0;for(const e of es){if(e.isIntersecting&&e.intersectionRatio>ratio){best=e.target;ratio=e.intersectionRatio}}if(best&&ratio>.62)playOnly(best)},{root,threshold:[.62,.8,.95]});cards.forEach(c=>{observer.observe(c);const v=c.querySelector('video');v.loop=true;v.muted=true;v.addEventListener('timeupdate',()=>{const i=c.querySelector('.progress i');if(i&&v.duration)i.style.width=(v.currentTime/v.duration*100)+'%'});v.addEventListener('ended',()=>{v.currentTime=0;v.play().catch(()=>{})})});if(cards[0])requestAnimationFrame(()=>playOnly(cards[0]))}
function playOnly(card){root.querySelectorAll('.reel').forEach(c=>{const v=c.querySelector('video');if(c!==card){v.pause();c.classList.remove('active');c.classList.add('paused')}});const v=card.querySelector('video');card.classList.add('active');card.classList.remove('paused');v.muted=true;v.play().catch(()=>{})}
let lastTap=0;root.addEventListener('pointerup',e=>{const card=e.target.closest('.reel');if(!card||e.target.closest('button'))return;const now=Date.now();if(now-lastTap<280){const like=card.querySelector('[data-a="like"]');if(like&&!like.classList.contains('active'))like.click();showHeart(card)}else{toggleVideo(card)}lastTap=now});
function showHeart(card){const h=document.createElement('div');h.textContent='♥';h.style.cssText='position:absolute;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);font-size:92px;color:#fff;text-shadow:0 10px 30px #0008;transition:.35s ease;pointer-events:none';card.appendChild(h);requestAnimationFrame(()=>h.style.transform='translate(-50%,-50%) scale(1.08)');setTimeout(()=>{h.style.opacity='0';h.style.transform='translate(-50%,-50%) scale(1.3)'},280);setTimeout(()=>h.remove(),650)}
const cb=document.getElementById('commentBackdrop'),cl=document.getElementById('commentList'),ci=document.getElementById('commentInput');let active=null;
async function openComments(id){active=id;cb.classList.add('open');cb.setAttribute('aria-hidden','false');cl.innerHTML='<div style="padding:35px;text-align:center;color:#999">Loading comments…</div>';const x=await reelComments(id);if(x.error){cl.innerHTML='<div style="padding:35px;text-align:center">'+esc(x.error.message)+'</div>';return}const rows=x.data||[];document.getElementById('commentTitle').textContent='Comments '+(rows.length||'');cl.innerHTML=rows.length?rows.map(c=>`<div class="comment"><div class="ca">${esc(initials(c.profiles?.full_name))}</div><div class="comment-body"><div><span class="comment-name">${esc(c.profiles?.full_name||'PICNIKO User')}</span><span class="comment-time">${ago(c.created_at)}</span></div><div>${esc(c.body||'')}</div></div></div>`).join(''):'<div style="padding:55px 20px;text-align:center;color:#999">No comments yet.<br>Be the first to comment.</div>';setTimeout(()=>ci.focus(),100)}
function closeComments(){cb.classList.remove('open');cb.setAttribute('aria-hidden','true');active=null}document.getElementById('commentClose').onclick=closeComments;cb.addEventListener('click',e=>{if(e.target===cb)closeComments()});document.getElementById('commentSend').onclick=async()=>{const body=ci.value.trim();if(!active||!body)return;const x=await addReelComment(active,body);if(x.error){toast(x.error.message);return}ci.value='';openComments(active)};ci.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('commentSend').click()}});
const createBackdrop=document.getElementById('createBackdrop');document.getElementById('create').onclick=()=>createBackdrop.classList.add('open');document.getElementById('createClose').onclick=()=>createBackdrop.classList.remove('open');document.getElementById('cancel').onclick=()=>createBackdrop.classList.remove('open');document.getElementById('publish').onclick=async()=>{try{const f=document.getElementById('video').files[0];if(!f)throw new Error('Please select a video');const x=await createReel({file:f,caption:document.getElementById('caption').value,hashtags:document.getElementById('hashtags').value.split(/[ ,]+/).filter(Boolean),locationName:document.getElementById('location').value});if(x.error)throw x.error;toast('Reel published successfully');createBackdrop.classList.remove('open');await load()}catch(e){toast(e.message)}};
async function load(){const x=await listReels(30);if(x.error){root.innerHTML='<div class="error"><div class="error-card"><h3>Reels backend</h3><p>'+esc(x.error.message)+'</p><small>Login and the existing PICNIKO Reels backend are required.</small></div></div>';return}render(x.data||[])}
load();
</script>
</body>
</html>
