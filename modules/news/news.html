<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PICNIKO — News</title><link rel="stylesheet" href="../../css/core.css"><link rel="stylesheet" href="../../css/reels.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/config.js"></script><style>.news{background:#fff;border:1px solid #e7e8ef;border-radius:20px;padding:16px;margin:10px 0}.news h2{margin:4px 0 8px}.meta{font-size:11px;color:#7b8192}.news-actions{display:flex;gap:8px;margin-top:12px}</style><link rel="stylesheet" href="../../css/mobile-app.css">
<link href="../../css/mobile-universal.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/v44-mobile-fit.css">
<link rel="stylesheet" href="../../css/v45-mobile-stable.css">
</head><body><div class="app"><div class="shell"><header class="top"><div class="topin"><a class="brand" href="../home/home.html"><span class="logo">P</span>PICNIKO</a><div class="row"><a class="icon" href="../messages/messages.html">✉</a><a class="avatar" href="../profile/profile.html">P</a></div></div></header><main class="page"><section class="hero"><span class="eyebrow">PICNIKO NEWS</span><h1>तुमच्या जगातील महत्त्वाच्या बातम्या.</h1><p>Local, travel, business, events आणि community updates.</p></section><div style="display:flex;gap:8px;margin:12px 0"><input id="q" class="discover-search" placeholder="News search..."><button id="go" class="btn outline">Search</button></div><div id="list"><div class="card">News loading…</div></div></main></div></div><script type="module">import {mountBottom} from '../../js/app.js';import {listNews,toggleNewsBookmark,toast,esc} from '../../js/v32-backend.js';mountBottom('home');const list=document.getElementById('list'),q=document.getElementById('q');async function load(){const x=await listNews(q.value);if(x.error){list.innerHTML=`<div class="card">${esc(x.error.message)}</div>`;return}list.innerHTML=(x.data||[]).map(n=>`<article class="news"><div class="meta">${esc(n.category||'News')} · ${esc(n.city||'India')} · ${new Date(n.published_at).toLocaleString()}</div><h2>${esc(n.title)}</h2><p>${esc(n.summary||n.body||'')}</p>${n.source_url?`<a href="${esc(n.source_url)}" target="_blank" rel="noopener">Source ↗</a>`:''}<div class="news-actions"><button class="btn outline" data-save="${n.id}">🔖 Save</button></div></article>`).join('')||'<div class="card">No news available.</div>';list.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const y=await toggleNewsBookmark(b.dataset.save);toast(y.error?y.error.message:'News saved state updated')})}document.getElementById('go').onclick=load;q.onkeydown=e=>{if(e.key==='Enter')load()};load();</script></body></html>
