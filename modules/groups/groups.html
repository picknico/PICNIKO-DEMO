<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PICNIKO — Groups</title><link rel="stylesheet" href="../../css/core.css"><link rel="stylesheet" href="../../css/reels.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/config.js"></script><style>.gtoolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.gcard{background:#fff;border:1px solid #e6e8ef;border-radius:18px;padding:15px;margin:9px 0}.gcard h3{margin:0 0 5px}.gpost{padding:11px 0;border-top:1px solid #eee}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:99;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{background:#fff;border-radius:22px;padding:18px;width:min(520px,100%)}.modalbox input,.modalbox textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;margin:7px 0;font:inherit}</style><link rel="stylesheet" href="../../css/mobile-app.css">
<link href="../../css/mobile-universal.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/v44-mobile-fit.css">
<link rel="stylesheet" href="../../css/v45-mobile-stable.css">
</head><body><div class="app"><div class="shell"><header class="top"><div class="topin"><a class="brand" href="../home/home.html"><span class="logo">P</span>PICNIKO</a><div class="row"><button id="newGroup" class="btn primary">＋ Group</button><a class="icon" href="../messages/messages.html">✉</a></div></div></header><main class="page"><section class="hero"><span class="eyebrow">PICNIKO GROUPS</span><h1>आपले communities एका जागी.</h1><p>Join, post, discuss and build local communities.</p></section><div class="gtoolbar"><input id="search" class="discover-search" placeholder="Group शोधा..."><button id="refresh" class="btn outline">↻ Refresh</button></div><div id="groups">Groups loading…</div></main></div></div><div id="modal" class="modal"><div class="modalbox"><h2>नवीन Group</h2><input id="gn" placeholder="Group name"><textarea id="gd" placeholder="Description"></textarea><div class="gtoolbar"><button id="create" class="btn primary">Create</button><button id="close" class="btn outline">Cancel</button></div></div></div><script type="module">import {mountBottom} from '../../js/app.js';import {listGroups,createGroup,joinGroup,groupPosts,addGroupPost,toast,esc} from '../../js/v32-backend.js';mountBottom('home');const root=document.getElementById('groups');let rows=[];function render(){const q=document.getElementById('search').value.toLowerCase();const a=rows.filter(g=>(g.name+' '+(g.description||'')).toLowerCase().includes(q));root.innerHTML=a.map(g=>`<div class="gcard"><h3>👥 ${esc(g.name)}</h3><p class="muted">${esc(g.description||'PICNIKO Community')}</p><div class="gtoolbar"><button class="btn primary" data-join="${g.id}">Join</button><button class="btn outline" data-open="${g.id}">Open</button></div><div id="posts-${g.id}" class="muted" style="display:none"></div></div>`).join('')||'<div class="card">No groups found.</div>';root.querySelectorAll('[data-join]').forEach(b=>b.onclick=async()=>{const x=await joinGroup(b.dataset.join);toast(x.error?x.error.message:'Group joined successfully')});root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGroup(b.dataset.open))}async function load(){const x=await listGroups();if(x.error){root.innerHTML=`<div class="card">${esc(x.error.message)}</div>`;return}rows=x.data||[];render()}async function openGroup(id){const box=document.getElementById('posts-'+id);box.style.display='block';const x=await groupPosts(id);if(x.error){box.textContent=x.error.message;return}box.innerHTML=(x.data||[]).map(p=>`<div class="gpost"><b>${esc(p.profiles?.full_name||'PICNIKO User')}</b><div>${esc(p.body||'')}</div></div>`).join('')+`<div class="gtoolbar"><input id="post-${id}" class="discover-search" placeholder="Post लिहा..."><button class="btn primary" data-post="${id}">Post</button></div>`;box.querySelector('[data-post]').onclick=async()=>{const input=document.getElementById('post-'+id);if(!input.value.trim())return;const y=await addGroupPost(id,input.value);toast(y.error?y.error.message:'Post added');openGroup(id)}}document.getElementById('newGroup').onclick=()=>document.getElementById('modal').classList.add('open');document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('create').onclick=async()=>{try{await createGroup(document.getElementById('gn').value,document.getElementById('gd').value);toast('Group created');document.getElementById('modal').classList.remove('open');load()}catch(e){toast(e.message)}};document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=load;load();</script></body></html>
