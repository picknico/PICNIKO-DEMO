<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PICNIKO — Marketplace</title><link rel="stylesheet" href="../../css/core.css"><link rel="stylesheet" href="../../css/reels.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/config.js"></script><style>.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mcard{background:#fff;border:1px solid #e7e8ef;border-radius:20px;padding:15px;position:relative}.price{font-size:20px;font-weight:900;color:#6337e8}.seller{font-size:11px;color:#7b8192}.mactions{display:flex;gap:7px;margin-top:12px}@media(max-width:650px){.mgrid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="shell"><header class="top"><div class="topin"><a class="brand" href="../home/home.html"><span class="logo">P</span>PICNIKO</a><div class="row"><button id="newListing" class="btn primary">＋ Sell</button><a class="icon" href="../messages/messages.html">✉</a><a class="avatar" href="../profile/profile.html">P</a></div></div></header><main class="page"><section class="hero"><span class="eyebrow">PICNIKO MARKETPLACE</span><h1>Buy local. Sell local.</h1><p>Products, verified sellers, offers आणि creator-linked sales.</p></section><div style="display:flex;gap:8px;margin:12px 0"><input id="q" class="discover-search" placeholder="Product, category, city..."><button id="go" class="btn outline">Search</button></div><section id="sell" class="card" style="display:none;margin-bottom:12px"><b>Create Listing</b><input id="lt" class="discover-search" style="margin-top:8px" placeholder="Product title"><textarea id="ld" class="discover-search" style="margin-top:8px;min-height:80px" placeholder="Description"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="lc" class="discover-search" placeholder="Category"><input id="lp" class="discover-search" type="number" min="0" placeholder="Price ₹"><input id="ls" class="discover-search" type="number" min="0" placeholder="Stock"><input id="lcity" class="discover-search" placeholder="City"></div><div style="display:flex;gap:8px;margin-top:10px"><button id="publishListing" class="btn primary">Publish</button><button id="cancelListing" class="btn outline">Cancel</button></div></section><div id="list" class="mgrid"><div class="card">Marketplace loading…</div></div></main></div></div><script type="module">import {mountBottom} from '../../js/app.js';import {listMarketplace,createListing,toggleFavorite,inquireListing,toast,esc} from '../../js/v32-backend.js';mountBottom('marketplace');const list=document.getElementById('list'),q=document.getElementById('q');async function load(){const x=await listMarketplace(q.value);if(x.error){list.innerHTML=`<div class="card">${esc(x.error.message)}</div>`;return}list.innerHTML=(x.data||[]).map(p=>`<article class="mcard"><div class="seller">${esc(p.category||'Product')} · ${esc(p.city||'India')}</div><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><div class="price">₹${Number(p.price||0).toLocaleString('en-IN')}</div><div class="seller">Seller: ${esc(p.profiles?.full_name||'PICNIKO Seller')}</div><div class="mactions"><button class="btn outline" data-fav="${p.id}">♡ Save</button><button class="btn primary" data-inq="${p.id}">Contact Seller</button></div></article>`).join('')||'<div class="card">No listings available.</div>';list.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async()=>{const y=await toggleFavorite(b.dataset.fav);toast(y.error?y.error.message:'Favourite updated')});list.querySelectorAll('[data-inq]').forEach(b=>b.onclick=async()=>{const m=prompt('Seller ला काय विचारायचे?');if(!m?.trim())return;const y=await inquireListing(b.dataset.inq,m);toast(y.error?y.error.message:'Inquiry sent to seller')})}document.getElementById('newListing').onclick=()=>document.getElementById('sell').style.display='block';document.getElementById('cancelListing').onclick=()=>document.getElementById('sell').style.display='none';document.getElementById('publishListing').onclick=async()=>{const x=await createListing({title:document.getElementById('lt').value,description:document.getElementById('ld').value,category:document.getElementById('lc').value,price:document.getElementById('lp').value,stockQuantity:document.getElementById('ls').value,city:document.getElementById('lcity').value});if(x.error)toast(x.error.message);else{toast('Listing published');document.getElementById('sell').style.display='none';load()}};document.getElementById('go').onclick=load;q.onkeydown=e=>{if(e.key==='Enter')load()};load();</script></body></html>
