<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICNIKO — Database Status</title><link rel="stylesheet" href="../../css/core.css"><script src="../../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="app"><div class="shell"><header class="top"><div class="topin"><a class="brand" href="../home/home.html"><span class="logo">P</span>PICNIKO</a></div></header><main class="page"><section class="hero"><span class="eyebrow">DATABASE • SECURITY</span><h1>Supabase readiness</h1><p>Connection diagnostics only. No secrets are displayed or stored here.</p></section><section class="card" id="status">Checking configuration…</section><section class="card"><h2>Safety</h2><p class="muted">This page performs no schema changes and does not use a service-role key.</p></section></main></div></div><script>const out=document.getElementById('status');const cfg=window.PICNIKO_CONFIG||{};const configured=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!String(cfg.SUPABASE_URL).includes('YOUR_')&&!String(cfg.SUPABASE_ANON_KEY).includes('YOUR_');out.innerHTML='<h2>Configuration: '+(configured?'Ready':'Not configured')+'</h2><p class="muted">'+(configured?'Public configuration values are present. Refresh after saving config.js.':'Add the public Supabase URL and publishable key in js/config.js.')+'</p>';</script></body></html>
