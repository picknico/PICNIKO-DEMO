<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>PICNIKO — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08090c;color:#fff}body{min-height:100svh;display:grid;place-items:center;padding:18px;overflow-x:hidden}.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38}.o1{width:280px;height:280px;background:#6337e8;left:-90px;top:-80px}.o2{width:250px;height:250px;background:#12aebe;right:-90px;bottom:-60px}.card{position:relative;width:min(100%,430px);padding:26px 20px 20px;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:rgba(17,18,23,.91);backdrop-filter:blur(24px);box-shadow:0 25px 80px rgba(0,0,0,.48)}.brand{text-align:center;font-size:34px;font-weight:950;letter-spacing:-1.8px;background:linear-gradient(90deg,#fff,#a78bfa,#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}.tag{text-align:center;color:#a9abb5;font-size:11px;margin:4px 0 22px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#202126;border-radius:14px;padding:4px;margin-bottom:16px}.tab{border:0;border-radius:11px;padding:11px;background:transparent;color:#9ea0aa;font-weight:850}.tab.active{background:#fff;color:#111}.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.method{border:1px solid #34353d;background:#18191e;color:#fff;border-radius:13px;padding:11px 8px;font-weight:800;font-size:12px}.method.active{border-color:#8b5cf6;background:#241b43;color:#d9ccff}.fb{width:100%;border:0;border-radius:14px;padding:13px;background:#1877f2;color:#fff;font-weight:900;margin-bottom:12px}.divider{display:flex;align-items:center;gap:8px;color:#6f727d;font-size:10px;margin:12px 0}.divider:before,.divider:after{content:"";height:1px;background:#303139;flex:1}label{display:block;font-size:12px;font-weight:800;color:#d7d8dd;margin:12px 0 6px}input{width:100%;height:48px;border:1px solid #34353d;border-radius:14px;background:#111217;color:#fff;padding:0 14px;outline:0}input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.13)}.primary{width:100%;margin-top:15px;height:50px;border:0;border-radius:15px;background:linear-gradient(135deg,#6337e8,#8b5cf6);color:#fff;font-weight:950;font-size:15px}.hint{font-size:11px;color:#858892;line-height:1.5;margin-top:12px;text-align:center}.status{display:none;margin-top:12px;border-radius:12px;padding:10px;font-size:12px;line-height:1.45}.status.show{display:block}.status.error{background:#35161e;color:#ffb4c0}.status.ok{background:#102c21;color:#9cf0c6}.demo{display:block;text-align:center;margin-top:13px;color:#a78bfa;font-size:11px}.hidden{display:none!important}.small-note{font-size:10px;color:#70737e;margin-top:8px;line-height:1.4}
@media(max-width:390px){body{padding:10px}.card{padding:22px 15px;border-radius:24px}.brand{font-size:30px}}
</style>
<link href="../css/mobile-universal.css" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/v44-mobile-fit.css">
<link rel="stylesheet" href="../css/v45-mobile-stable.css">
</head>
<body>
<div class="bg"><i class="orb o1"></i><i class="orb o2"></i></div>
<main class="card">
  <div class="brand">PICNIKO</div>
  <div class="tag">Explore • Connect • Earn</div>
  <div class="tabs"><button class="tab active" id="loginTab">Login</button><button class="tab" id="signupTab">Create account</button></div>
  <div class="methods" id="methods"><button class="method active" id="emailMethod">Email / User ID</button><button class="method" id="facebookMethod">Facebook</button></div>
  <button class="fb hidden" id="facebookBtn" type="button">Continue with Facebook</button>
  <div id="emailArea">
    <label for="identifier">Email / PICNIKO User ID</label>
    <input id="identifier" autocomplete="username" placeholder="Email ID किंवा User ID">
    <div class="small-note">Existing Supabase Auth connectivity सुरक्षित ठेवली आहे. Username-only login साठी स्वतंत्र verified mapping backend मध्ये आवश्यक आहे.</div>
    <label for="password">Password</label>
    <input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="Password">
    <button class="primary" id="submitBtn" type="submit">Login</button>
  </div>
  <div id="signupArea" class="hidden">
    <label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com">
    <label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="6" autocomplete="new-password" placeholder="किमान 6 अक्षरे">
    <button class="primary" id="signupBtn" type="button">Create account</button>
  </div>
  <div class="divider"><span>Secure Supabase Auth</span></div>
  <div class="hint">Login झाल्यावर तुमची category निवडा आणि PICNIKO Home उघडा.</div>
  <div id="status" class="status" aria-live="polite"></div>
  <a class="demo" href="../onboarding/category.html">Demo पुढे उघडा</a>
</main>
<script type="module">
import {getDb} from '../js/db.js';
const $=id=>document.getElementById(id);let mode='login',method='email';const db=getDb();
function status(t,k=''){const e=$('status');e.textContent=t;e.className='status '+(t?'show ':'')+k}
function refresh(){ $('loginTab').classList.toggle('active',mode==='login');$('signupTab').classList.toggle('active',mode==='signup');$('methods').classList.toggle('hidden',mode==='signup');$('emailArea').classList.toggle('hidden',mode!=='login'||method!=='email');$('facebookBtn').classList.toggle('hidden',mode!=='login'||method!=='facebook');$('signupArea').classList.toggle('hidden',mode!=='signup');}
$('loginTab').onclick=()=>{mode='login';refresh();status('')};$('signupTab').onclick=()=>{mode='signup';refresh();status('')};$('emailMethod').onclick=()=>{method='email';$('emailMethod').classList.add('active');$('facebookMethod').classList.remove('active');refresh();status('')};$('facebookMethod').onclick=()=>{method='facebook';$('facebookMethod').classList.add('active');$('emailMethod').classList.remove('active');refresh();status('')};
async function go(){location.href='../onboarding/category.html'}
if(db){const {data}=await db.auth.getSession();if(data?.session)go()}
$('submitBtn').onclick=async()=>{if(!db)return status('Supabase config उपलब्ध नाही.','error');const identifier=$('identifier').value.trim(),password=$('password').value;if(!identifier||!password)return status('Email/User ID आणि Password भरा.','error');if(!identifier.includes('@'))return status('सध्याच्या सुरक्षित Auth contract मध्ये password login साठी Email आवश्यक आहे. User-ID-only login जोडण्यासाठी backend mapping न बदलता करता येणार नाही.','error');try{const r=await db.auth.signInWithPassword({email:identifier,password});if(r.error)throw r.error;status('Login successful…','ok');setTimeout(go,250)}catch(e){status(e.message||'Login failed.','error')}};
$('signupBtn').onclick=async()=>{if(!db)return status('Supabase config उपलब्ध नाही.','error');const email=$('signupEmail').value.trim(),password=$('signupPassword').value;if(!email||!password)return status('Email आणि Password भरा.','error');try{const r=await db.auth.signUp({email,password});if(r.error)throw r.error;status('Account तयार झाला. Email confirmation आवश्यक असल्यास email तपासा.','ok')}catch(e){status(e.message||'Signup failed.','error')}};
$('facebookBtn').onclick=async()=>{if(!db)return status('Supabase config उपलब्ध नाही.','error');try{const r=await db.auth.signInWithOAuth({provider:'facebook',options:{redirectTo:new URL('../onboarding/category.html',location.href).href}});if(r.error)throw r.error}catch(e){status(e.message||'Facebook login सुरू झाला नाही. Supabase मध्ये Facebook provider enable आहे का ते तपासा.','error')}};
refresh();
</script>
</body></html>
